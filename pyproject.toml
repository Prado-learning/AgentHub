[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-demo"
version = "0.1.0"
description = "Day 1 AgentHub demo with React and FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agenthub*", "app*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
